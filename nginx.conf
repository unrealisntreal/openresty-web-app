events {
    worker_connections 1024;
}

http {
    include mime.types;

    server {
        listen 80;

        location /assets/ {
             alias /usr/local/openresty/nginx/client/assets/;
        }

        location /css/ {
            alias /usr/local/openresty/nginx/client/styles/;
        }

        location /js/ {
            alias /usr/local/openresty/nginx/client/scripts/;
        }

        location / {
            alias /usr/local/openresty/nginx/client/pages/;
            index index.html;
        }

        location /api/ {
            content_by_lua_file /usr/local/openresty/nginx/server/main.lua;
        }
    }
}